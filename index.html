<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ジャングル探検隊 - 松野先生救出シューティング</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    /* 画面全体を固定してスクロールやバーによるガタつきを防止 */
    html, body {
      width: 100%; height: 100%;
      height: 100vh; height: -webkit-fill-available;
      overflow: hidden;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background: #0f2412;
      position: fixed; top: 0; left: 0;
    }

    /* フルスクリーン用コンテナ */
    #game-container {
      width: 100vw; height: 100vh;
      height: -webkit-fill-available;
      position: relative;
      overflow: hidden;
    }

    #camera-feed {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: cover; z-index: 1;
    }

    #proc-canvas { display: none; }

    /* 木目調・ジャングルUI */
    .wooden-panel {
      background: linear-gradient(180deg, #8b5a2b 0%, #5c3a17 100%);
      border: 3px solid #3d230d;
      border-radius: 16px;
      box-shadow: 0 6px 0 #261507, inset 0 2px 0 rgba(255,255,255,0.3), 0 8px 16px rgba(0,0,0,0.6);
      position: relative;
    }
    .wooden-panel::before {
      content: '🌿'; position: absolute; top: -12px; left: -10px; font-size: 22px; transform: rotate(-20deg);
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }
    .wooden-panel::after {
      content: '🍃'; position: absolute; bottom: -8px; right: -8px; font-size: 20px; transform: rotate(15deg);
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    /* スタート画面 */
    #start-overlay {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 999;
      background: radial-gradient(circle, rgba(16, 42, 20, 0.88) 0%, rgba(5, 18, 8, 0.96) 100%);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 15px;
    }

    .start-board {
      width: 85%; max-width: 520px; padding: 18px 25px; text-align: center;
    }
    .start-board h1 {
      font-size: clamp(18px, 4vw, 26px); font-weight: 900; color: #ffe600;
      text-shadow: 2px 2px 0 #5c2c00, -2px -2px 0 #5c2c00, 2px -2px 0 #5c2c00, -2px 2px 0 #5c2c00;
      letter-spacing: 1px; margin-bottom: 4px;
    }
    .start-board .subtitle {
      font-size: clamp(12px, 2.5vw, 15px); color: #76ff03; font-weight: 900;
      text-shadow: 1px 1px 2px #000; margin-bottom: 10px;
    }
    .start-board p {
      font-size: clamp(11px, 2vw, 13px); color: #fff; line-height: 1.4; font-weight: 800;
      background: rgba(0,0,0,0.35); padding: 8px 12px; border-radius: 10px;
      border: 1.5px solid #3d230d; text-shadow: 1px 1px 2px #000;
    }

    .btn-gold {
      background: linear-gradient(180deg, #ffe600 0%, #ff9900 100%);
      color: #3d1e00; border: 2.5px solid #fff; padding: 10px 32px;
      font-size: clamp(16px, 3.2vw, 20px); font-weight: 900; border-radius: 40px; margin-top: 12px;
      box-shadow: 0 4px 0 #a65100, 0 6px 12px rgba(0,0,0,0.5); cursor: pointer;
      text-shadow: 0 1px 0 rgba(255,255,255,0.6); transition: transform 0.1s;
    }
    .btn-gold:active { transform: translateY(3px); box-shadow: 0 1px 0 #a65100; }

    /* HUD */
    #ui-layer {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10;
      display: flex; flex-direction: column; justify-content: space-between; padding: 10px 20px;
      pointer-events: none;
    }

    .hud-header {
      display: flex; justify-content: space-between; align-items: center; padding: 6px 18px;
    }
    .score-badge {
      font-size: clamp(14px, 2.8vw, 18px); font-weight: 900; color: #ffe600;
      text-shadow: 2px 2px 0 #000; display: flex; align-items: center; gap: 6px;
    }

    #lockon-indicator {
      font-size: clamp(12px, 2.2vw, 15px); font-weight: 900; color: #b2ff59; text-shadow: 1px 1px 2px #000;
    }
    #lockon-indicator.locked { color: #ff3d00; text-shadow: 0 0 8px #ff3d00, 1px 1px 0 #000; }

    .crosshair {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: min(50vw, 55vh); height: min(50vw, 55vh);
      border: 3px dashed rgba(255, 230, 0, 0.75); border-radius: 20px;
      box-shadow: 0 0 15px rgba(0,0,0,0.3);
      pointer-events: none; transition: all 0.15s ease;
    }
    .crosshair::after {
      content: '🎯'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: clamp(20px, 4vh, 32px); filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .crosshair.detected {
      border: 5px solid #ff1744 !important;
      background: rgba(255, 23, 68, 0.2);
      transform: translate(-50%, -50%) scale(1.05);
      box-shadow: 0 0 30px rgba(255, 23, 68, 0.9) !important;
    }

    #hit-flash {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 5;
      background: rgba(255, 230, 0, 0.4); opacity: 0; transition: opacity 0.08s ease;
      pointer-events: none;
    }
    #shot-flash {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 4;
      background: rgba(255, 255, 255, 0.3); opacity: 0; transition: opacity 0.05s ease;
      pointer-events: none;
    }

    #result-modal {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 100;
      background: radial-gradient(circle, rgba(16, 42, 20, 0.95) 0%, rgba(5, 18, 8, 0.98) 100%);
      display: none; flex-direction: column; align-items: center; justify-content: center; padding: 15px;
    }
    .result-board {
      width: 80%; max-width: 480px; padding: 20px; text-align: center;
    }
    .result-board h1 {
      font-size: clamp(20px, 4.5vw, 28px); font-weight: 900; color: #ffe600;
      text-shadow: 2px 2px 0 #5c2c00; margin-bottom: 4px;
    }
    .result-board p { color: #76ff03; font-size: clamp(12px, 2.5vw, 15px); font-weight: 900; }
    .score-box {
      font-size: clamp(36px, 8vw, 54px); font-weight: 900; color: #fff; margin: 10px 0;
      text-shadow: 3px 3px 0 #e65100, 0 0 15px #ff9100;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <video id="camera-feed" autoplay playsinline muted></video>
    <canvas id="proc-canvas" width="160" height="120"></canvas>

    <div id="start-overlay">
      <div class="wooden-panel start-board">
        <h1>松野先生救出作戦</h1>
        <div class="subtitle">🌴 ジャングル危険地帯 🗿</div>
        <p>暴走ロボットとマッドサイエンティストを倒し、解毒薬を手に入れて松野先生を救出せよ！</p>
        <button id="start-btn" class="btn-gold">ミッション開始</button>
      </div>
    </div>

    <div id="ui-layer">
      <div class="hud-header wooden-panel">
        <div class="score-badge">🏆 SCORE: <span id="score-val">0</span></div>
        <div id="lockon-indicator">🔍 ターゲット捜索中...</div>
      </div>
      <div class="crosshair" id="crosshair"></div>
    </div>

    <div id="hit-flash"></div>
    <div id="shot-flash"></div>

    <div id="result-modal">
      <div class="wooden-panel result-board">
        <h1>MISSION COMPLETE!</h1>
        <p>松野先生の救出に成功しました！</p>
        <div class="score-box"><span id="final-score">0</span><span style="font-size:20px;"> PT</span></div>
        <button class="btn-gold" onclick="location.reload()">もう一度挑戦</button>
      </div>
    </div>
  </div>

  <script>
    let score = 0;
    let isRedDetected = false;
    let isCoolingDown = false;
    let isGameStarted = false;

    const gameContainer = document.getElementById('game-container');
    const videoEl = document.getElementById('camera-feed');
    const canvasEl = document.getElementById('proc-canvas');
    const ctx = canvasEl.getContext('2d', { willReadFrequently: true });

    const scoreVal = document.getElementById('score-val');
    const lockonIndicator = document.getElementById('lockon-indicator');
    const crosshair = document.getElementById('crosshair');
    const hitFlash = document.getElementById('hit-flash');
    const shotFlash = document.getElementById('shot-flash');
    const startOverlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');

    let audioCtx;

    // 全画面表示（フルスクリーン）に切り替える関数
    function requestFullScreen() {
      const docEl = document.documentElement;
      if (docEl.requestFullscreen) {
        docEl.requestFullscreen().catch(() => {});
      } else if (docEl.webkitRequestFullscreen) { /* Safari (iOS/Mac) */
        docEl.webkitRequestFullscreen().catch(() => {});
      } else if (docEl.msRequestFullscreen) {
        docEl.msRequestFullscreen().catch(() => {});
      }
      
      // アドレスバー非表示のための自動スクロール処理
      window.scrollTo(0, 1);
    }

    function playShotSE() {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      } catch (e) {}
    }

    function playHitSE() {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(450, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(90, audioCtx.currentTime + 0.22);
        gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.22);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.22);
      } catch (e) {}
    }

    startBtn.addEventListener('click', async () => {
      // 1. フルスクリーン化を要求
      requestFullScreen();

      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') await audioCtx.resume();
      } catch (e) {}

      // 2. カメラ起動処理
      const constraintsList = [
        { video: { facingMode: { exact: "environment" } }, audio: false },
        { video: { facingMode: "environment" }, audio: false },
        { video: true, audio: false }
      ];

      let stream = null;
      let lastErr = null;

      for (const constraints of constraintsList) {
        try {
          stream = await navigator.mediaDevices.getUserMedia(constraints);
          if (stream) break;
        } catch (err) {
          lastErr = err;
        }
      }

      if (!stream) {
        alert("カメラの起動に失敗しました。\n・カメラの使用を許可してください\n・他のアプリを終了させてください");
        return;
      }

      videoEl.srcObject = stream;

      try {
        await videoEl.play();
      } catch (e) {
        console.log("Play interrupted", e);
      }

      startOverlay.style.display = 'none';
      isGameStarted = true;

      requestAnimationFrame(processFrame);

      setTimeout(() => {
        document.getElementById('result-modal').style.display = 'flex';
        document.getElementById('final-score').textContent = score;
      }, 40000);
    });

    function rgbToHsv(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      const d = max - min;
      let h = 0;
      const s = max === 0 ? 0 : d / max;
      const v = max;

      if (max !== min) {
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
      }
      return [h * 360, s, v];
    }

    function processFrame() {
      if (!isGameStarted) return;

      if (videoEl.readyState === videoEl.HAVE_ENOUGH_DATA) {
        ctx.drawImage(videoEl, 0, 0, 160, 120);

        const startX = 32;
        const startY = 24;
        const width = 96;
        const height = 72;

        const imgData = ctx.getImageData(startX, startY, width, height);
        const data = imgData.data;

        let redPixelCount = 0;
        const totalPixels = width * height;

        for (let i = 0; i < data.length; i += 4) {
          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];

          const [h, s, v] = rgbToHsv(r, g, b);

          if ((h >= 335 || h <= 22) && s > 0.40 && v > 0.28) {
            redPixelCount++;
          }
        }

        if (redPixelCount / totalPixels > 0.05) {
          if (!isRedDetected) {
            isRedDetected = true;
            lockonIndicator.textContent = "🎯 ターゲット捕捉！";
            lockonIndicator.classList.add('locked');
            crosshair.classList.add('detected');
          }
        } else {
          if (isRedDetected) {
            isRedDetected = false;
            lockonIndicator.textContent = "🔍 ターゲット捜索中...";
            lockonIndicator.classList.remove('locked');
            crosshair.classList.remove('detected');
          }
        }
      }

      requestAnimationFrame(processFrame);
    }

    window.addEventListener('pointerdown', (e) => {
      if (!isGameStarted || e.target === startBtn || e.target.classList.contains('btn-gold')) return;

      playShotSE();
      shotFlash.style.opacity = '1';
      setTimeout(() => { shotFlash.style.opacity = '0'; }, 50);

      if (isRedDetected && !isCoolingDown) {
        score += 100;
        scoreVal.textContent = score;
        playHitSE();

        hitFlash.style.opacity = '1';
        setTimeout(() => { hitFlash.style.opacity = '0'; }, 120);

        isCoolingDown = true;
        setTimeout(() => { isCoolingDown = false; }, 800);
      }
    });
  </script>
</body>
</html>
