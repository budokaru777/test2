<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ジャングル探検隊 - 松野先生救出シューティング</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    html, body {
      width: 100%; height: 100%;
      height: 100vh; height: -webkit-fill-available;
      overflow: hidden;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background: #0f2412;
      position: fixed; top: 0; left: 0;
    }

    #game-container {
      width: 100vw; height: 100vh;
      height: -webkit-fill-available;
      position: relative;
      overflow: hidden;
    }

    #camera-feed {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: cover; z-index: 1;
    }

    #proc-canvas { display: none; }

    .wooden-panel {
      background: linear-gradient(180deg, #8b5a2b 0%, #5c3a17 100%);
      border: 3px solid #3d230d;
      border-radius: 16px;
      box-shadow: 0 6px 0 #261507, inset 0 2px 0 rgba(255,255,255,0.3), 0 8px 16px rgba(0,0,0,0.6);
      position: relative;
    }
    .wooden-panel::before {
      content: '🌿'; position: absolute; top: -12px; left: -10px; font-size: 22px; transform: rotate(-20deg);
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }
    .wooden-panel::after {
      content: '🍃'; position: absolute; bottom: -8px; right: -8px; font-size: 20px; transform: rotate(15deg);
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    /* スタート画面 */
    #start-overlay {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 999;
      background: radial-gradient(circle, rgba(16, 42, 20, 0.88) 0%, rgba(5, 18, 8, 0.96) 100%);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 15px;
    }

    .start-board {
      width: 85%; max-width: 520px; padding: 18px 25px; text-align: center;
    }
    .start-board h1 {
      font-size: clamp(18px, 4vw, 26px); font-weight: 900; color: #ffe600;
      text-shadow: 2px 2px 0 #5c2c00, -2px -2px 0 #5c2c00, 2px -2px 0 #5c2c00, -2px 2px 0 #5c2c00;
      letter-spacing: 1px; margin-bottom: 4px;
    }
    .start-board .subtitle {
      font-size: clamp(12px, 2.5vw, 15px); color: #76ff03; font-weight: 900;
      text-shadow: 1px 1px 2px #000; margin-bottom: 10px;
    }
    .start-board p {
      font-size: clamp(11px, 2vw, 13px); color: #fff; line-height: 1.4; font-weight: 800;
      background: rgba(0,0,0,0.35); padding: 8px 12px; border-radius: 10px;
      border: 1.5px solid #3d230d; text-shadow: 1px 1px 2px #000;
    }

    .btn-gold {
      background: linear-gradient(180deg, #ffe600 0%, #ff9900 100%);
      color: #3d1e00; border: 2.5px solid #fff; padding: 10px 32px;
      font-size: clamp(16px, 3.2vw, 20px); font-weight: 900; border-radius: 40px; margin-top: 12px;
      box-shadow: 0 4px 0 #a65100, 0 6px 12px rgba(0,0,0,0.5); cursor: pointer;
      text-shadow: 0 1px 0 rgba(255,255,255,0.6); transition: transform 0.1s;
    }
    .btn-gold:active { transform: translateY(3px); box-shadow: 0 1px 0 #a65100; }

    /* HUD */
    #ui-layer {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10;
      display: flex; flex-direction: column; justify-content: space-between; padding: 10px 20px;
      pointer-events: none;
    }

    .hud-header {
      display: flex; justify-content: space-between; align-items: center; padding: 6px 18px;
    }
    .score-badge {
      font-size: clamp(14px, 2.8vw, 18px); font-weight: 900; color: #ffe600;
      text-shadow: 2px 2px 0 #000; display: flex; align-items: center; gap: 6px;
    }

    #lockon-indicator {
      font-size: clamp(12px, 2.2vw, 15px); font-weight: 900; color: #b2ff59; text-shadow: 1px 1px 2px #000;
    }
    #lockon-indicator.locked { color: #ff3d00; text-shadow: 0 0 8px #ff3d00, 1px 1px 0 #000; }

    .crosshair {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: min(50vw, 55vh); height: min(50vw, 55vh);
      border: 3px dashed rgba(255, 230, 0, 0.75); border-radius: 20px;
      box-shadow: 0 0 15px rgba(0,0,0,0.3);
      pointer-events: none; transition: all 0.15s ease;
    }
    .crosshair::after {
      content: '🎯'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: clamp(20px, 4vh, 32px); filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .crosshair.detected {
      border: 5px solid #ff1744 !important;
      background: rgba(255, 23, 68, 0.2);
      transform: translate(-50%, -50%) scale(1.05);
      box-shadow: 0 0 30px rgba(255, 23, 68, 0.9) !important;
    }

    /* 警告・ボスUI */
    #warning-overlay {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 50;
      background: rgba(255, 0, 0, 0.3); display: none; flex-direction: column;
      justify-content: center; align-items: center; pointer-events: none;
      animation: blink 0.5s infinite alternate;
    }
    @keyframes blink { from { opacity: 0.3; } to { opacity: 0.8; } }

    #warning-text {
      font-size: clamp(32px, 8vw, 64px); font-weight: 900; color: #ff1744;
      text-shadow: 3px 3px 0 #000, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000;
      letter-spacing: 4px;
    }

    #boss-hp-container {
      position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
      width: 80%; max-width: 400px; display: none; flex-direction: column;
      align-items: center; z-index: 20;
    }
    .boss-label { font-size: 16px; font-weight: 900; color: #ff3d00; text-shadow: 1px 1px 2px #000; margin-bottom: 4px; }
    .hp-bar-bg { width: 100%; height: 20px; background: #333; border: 2px solid #fff; border-radius: 10px; overflow: hidden; }
    .hp-bar-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #ff1744, #ff9100); transition: width 0.2s ease; }

    #hit-flash {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 5;
      background: rgba(255, 230, 0, 0.4); opacity: 0; transition: opacity 0.08s ease;
      pointer-events: none;
    }

    #result-modal {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 100;
      background: radial-gradient(circle, rgba(16, 42, 20, 0.95) 0%, rgba(5, 18, 8, 0.98) 100%);
      display: none; flex-direction: column; align-items: center; justify-content: center; padding: 15px;
    }
    .result-board { width: 80%; max-width: 480px; padding: 20px; text-align: center; }
    .result-board h1 { font-size: clamp(20px, 4.5vw, 28px); font-weight: 900; color: #ffe600; text-shadow: 2px 2px 0 #5c2c00; margin-bottom: 4px; }
    .result-board p { color: #76ff03; font-size: clamp(12px, 2.5vw, 15px); font-weight: 900; }
    .score-box { font-size: clamp(36px, 8vw, 54px); font-weight: 900; color: #fff; margin: 10px 0; text-shadow: 3px 3px 0 #e65100, 0 0 15px #ff9100; }
  </style>
</head>
<body>

  <div id="game-container">
    <video id="camera-feed" autoplay playsinline muted></video>
    <canvas id="proc-canvas" width="160" height="120"></canvas>

    <div id="start-overlay">
      <div class="wooden-panel start-board">
        <h1>松野先生救出作戦</h1>
        <div class="subtitle">🌴 ハンズフリー・自動エイムモード 🗿</div>
        <p>カメラを赤い標的に向けるだけで自動発射！コースターの上から標的を撃ち抜け！</p>
        <button id="start-btn" class="btn-gold">ミッション開始</button>
      </div>
    </div>

    <div id="ui-layer">
      <div class="hud-header wooden-panel">
        <div class="score-badge">🏆 SCORE: <span id="score-val">0</span></div>
        <div id="lockon-indicator">🔍 ターゲット捜索中...</div>
      </div>
      <div class="crosshair" id="crosshair"></div>
    </div>

    <!-- ボスHPUI -->
    <div id="boss-hp-container">
      <div class="boss-label">🤖 BOSS: 暴走マッドロボ</div>
      <div class="hp-bar-bg"><div id="boss-hp-fill" class="hp-bar-fill"></div></div>
    </div>

    <!-- 警告表示 -->
    <div id="warning-overlay">
      <div id="warning-text">⚠️ WARNING ⚠️</div>
      <div style="color:#fff; font-weight:900; font-size:20px; text-shadow:1px 1px 2px #000;">BOSS APPROACHING!</div>
    </div>

    <div id="hit-flash"></div>

    <div id="result-modal">
      <div class="wooden-panel result-board">
        <h1>MISSION COMPLETE!</h1>
        <p>松野先生の救出に成功しました！</p>
        <div class="score-box"><span id="final-score">0</span><span style="font-size:20px;"> PT</span></div>
        <button class="btn-gold" onclick="location.reload()">もう一度挑戦</button>
      </div>
    </div>
  </div>

  <script>
    let score = 0;
    let isRedDetected = false;
    let isGameStarted = false;
    
    // 状態管理フラグ
    let canScore = true;       // 一度得点が入ったら離すまで false にするフラグ
    let isBossPhase = false;   // ボス戦中か否か
    let bossHp = 10;           // ボスの耐久値 (10ヒットで撃破)
    const MAX_BOSS_HP = 10;

    const videoEl = document.getElementById('camera-feed');
    const canvasEl = document.getElementById('proc-canvas');
    const ctx = canvasEl.getContext('2d', { willReadFrequently: true });

    const scoreVal = document.getElementById('score-val');
    const lockonIndicator = document.getElementById('lockon-indicator');
    const crosshair = document.getElementById('crosshair');
    const hitFlash = document.getElementById('hit-flash');
    const startOverlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');
    const warningOverlay = document.getElementById('warning-overlay');
    const bossHpContainer = document.getElementById('boss-hp-container');
    const bossHpFill = document.getElementById('boss-hp-fill');

    let audioCtx;

    function requestFullScreen() {
      const docEl = document.documentElement;
      if (docEl.requestFullscreen) { docEl.requestFullscreen().catch(() => {}); }
      else if (docEl.webkitRequestFullscreen) { docEl.webkitRequestFullscreen().catch(() => {}); }
      else if (docEl.msRequestFullscreen) { docEl.msRequestFullscreen().catch(() => {}); }
      window.scrollTo(0, 1);
    }

    function playShotSE() {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      } catch (e) {}
    }

    function playHitSE() {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(450, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(90, audioCtx.currentTime + 0.22);
        gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.22);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.22);
      } catch (e) {}
    }

    function playWarningSE() {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.setValueAtTime(400, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
      } catch(e) {}
    }

    startBtn.addEventListener('click', async () => {
      requestFullScreen();

      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') await audioCtx.resume();
      } catch (e) {}

      const constraintsList = [
        { video: { facingMode: { exact: "environment" } }, audio: false },
        { video: { facingMode: "environment" }, audio: false },
        { video: true, audio: false }
      ];

      let stream = null;
      for (const constraints of constraintsList) {
        try {
          stream = await navigator.mediaDevices.getUserMedia(constraints);
          if (stream) break;
        } catch (err) {}
      }

      if (!stream) {
        alert("カメラの起動に失敗しました。権限を確認してください。");
        return;
      }

      videoEl.srcObject = stream;
      try { await videoEl.play(); } catch (e) {}

      startOverlay.style.display = 'none';
      isGameStarted = true;

      requestAnimationFrame(processFrame);

      // コースター進行に合わせてボス戦へ自動移行 (例: 25秒後)
      setTimeout(triggerBossBattle, 25000);
    });

    function rgbToHsv(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      const d = max - min;
      let h = 0;
      const s = max === 0 ? 0 : d / max;
      const v = max;

      if (max !== min) {
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
      }
      return [h * 360, s, v];
    }

    function processFrame() {
      if (!isGameStarted) return;

      if (videoEl.readyState === videoEl.HAVE_ENOUGH_DATA) {
        ctx.drawImage(videoEl, 0, 0, 160, 120);

        const startX = 32;
        const startY = 24;
        const width = 96;
        const height = 72;

        const imgData = ctx.getImageData(startX, startY, width, height);
        const data = imgData.data;

        let redPixelCount = 0;
        const totalPixels = width * height;

        for (let i = 0; i < data.length; i += 4) {
          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];

          const [h, s, v] = rgbToHsv(r, g, b);

          if ((h >= 335 || h <= 22) && s > 0.40 && v > 0.28) {
            redPixelCount++;
          }
        }

        const isDetectedNow = (redPixelCount / totalPixels) > 0.05;

        if (isDetectedNow) {
          if (!isRedDetected) {
            isRedDetected = true;
            lockonIndicator.textContent = "🎯 ターゲット捕捉！";
            lockonIndicator.classList.add('locked');
            crosshair.classList.add('detected');
          }

          // --- 自動撃破＆スコア判定（1回離さないと再加算されない仕組み） ---
          if (canScore) {
            canScore = false; // 連続加算ロック
            onTargetHit();
          }

        } else {
          if (isRedDetected) {
            isRedDetected = false;
            lockonIndicator.textContent = "🔍 ターゲット捜索中...";
            lockonIndicator.classList.remove('locked');
            crosshair.classList.remove('detected');
          }
          // 一度画角から外れたら再び得点可能にする
          canScore = true;
        }
      }

      requestAnimationFrame(processFrame);
    }

    // ターゲット検知時の自動ヒット処理
    function onTargetHit() {
      playShotSE();
      playHitSE();

      hitFlash.style.opacity = '1';
      setTimeout(() => { hitFlash.style.opacity = '0'; }, 120);

      if (!isBossPhase) {
        // 通常時スコア加算
        score += 100;
        scoreVal.textContent = score;
      } else {
        // ボス戦時
        score += 200;
        scoreVal.textContent = score;
        bossHp--;
        const hpPercent = Math.max(0, (bossHp / MAX_BOSS_HP) * 100);
        bossHpFill.style.width = hpPercent + '%';

        if (bossHp <= 0) {
          endGame();
        }
      }
    }

    // ボス戦突入処理（画面の警告・サイレン効果）
    function triggerBossBattle() {
      if (!isGameStarted) return;

      warningOverlay.style.display = 'flex';
      playWarningSE();
      const warnInterval = setInterval(playWarningSE, 600);

      setTimeout(() => {
        clearInterval(warnInterval);
        warningOverlay.style.display = 'none';
        isBossPhase = true;
        bossHpContainer.style.display = 'flex';
        lockonIndicator.textContent = "⚠️ ボスを撃破せよ！";
      }, 3000);
    }

    function endGame() {
      isGameStarted = false;
      document.getElementById('result-modal').style.display = 'flex';
      document.getElementById('final-score').textContent = score;
    }
  </script>
</body>
</html>
