<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>秘島探検隊 - トロッコシューティング</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    html, body {
      width: 100%; height: 100%;
      height: 100vh; height: -webkit-fill-available;
      overflow: hidden;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background: #000;
      position: fixed; top: 0; left: 0;
    }

    #game-container {
      width: 100vw; height: 100vh;
      height: -webkit-fill-available;
      position: relative;
      overflow: hidden;
    }

    #camera-feed {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: cover; z-index: 1;
    }

    #proc-canvas { display: none; }

    /* 初期画面 */
    #start-overlay {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 999;
      background-color: #1a0f07;
      background-image: url('title_bg.jpg');
      background-position: center center;
      background-repeat: no-repeat;
      background-size: contain;
      
      display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
      padding-bottom: 10vh;
    }

    .btn-gold {
      background: linear-gradient(180deg, #ffe600 0%, #ff9900 100%);
      color: #3d1e00; border: 3px solid #fff; padding: 14px 48px;
      font-size: clamp(20px, 4vw, 28px); font-weight: 900; border-radius: 50px;
      box-shadow: 0 6px 0 #a65100, 0 10px 20px rgba(0,0,0,0.6); cursor: pointer;
      text-shadow: 0 1px 0 rgba(255,255,255,0.6); transition: transform 0.1s;
    }
    .btn-gold:active { transform: translateY(4px); box-shadow: 0 2px 0 #a65100; }

    /* HUD UI */
    .wooden-panel {
      background: linear-gradient(180deg, #8b5a2b 0%, #5c3a17 100%);
      border: 3px solid #3d230d; border-radius: 16px;
      box-shadow: 0 6px 0 #261507, inset 0 2px 0 rgba(255,255,255,0.3);
    }

    #ui-layer {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10;
      display: flex; flex-direction: column; justify-content: space-between; padding: 10px 20px;
      pointer-events: none;
    }

    .hud-header {
      display: flex; justify-content: space-between; align-items: center; padding: 6px 18px;
      pointer-events: auto;
    }
    .score-badge {
      font-size: clamp(16px, 3vw, 22px); font-weight: 900; color: #ffe600;
      text-shadow: 2px 2px 0 #000; cursor: pointer;
    }

    #lockon-indicator {
      font-size: clamp(12px, 2.2vw, 15px); font-weight: 900; color: #b2ff59; text-shadow: 1px 1px 2px #000;
    }
    #lockon-indicator.locked { color: #ff3d00; text-shadow: 0 0 8px #ff3d00; }
    #lockon-indicator.bonus { color: #ff69b4; text-shadow: 0 0 8px #ff69b4; }

    .crosshair {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: min(65vw, 65vh); height: min(65vw, 65vh);
      border: 3px dashed rgba(255, 230, 0, 0.75); border-radius: 20px;
      pointer-events: none; transition: all 0.15s ease;
    }
    .crosshair::after {
      content: '🎯'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: clamp(24px, 5vh, 40px);
    }

    .crosshair.detected-red {
      border: 5px solid #ff1744 !important; background: rgba(255, 23, 68, 0.25);
      transform: translate(-50%, -50%) scale(1.05); box-shadow: 0 0 30px #ff1744 !important;
    }
    .crosshair.detected-pink {
      border: 5px solid #ff69b4 !important; background: rgba(255, 105, 180, 0.4);
      transform: translate(-50%, -50%) scale(1.15); box-shadow: 0 0 45px #ff69b4 !important;
    }

    /* 💖 ピンクエフェクト用ポップアップ */
    #pink-effect-overlay {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 40;
      pointer-events: none; display: flex; flex-direction: column;
      justify-content: center; align-items: center; opacity: 0; transition: opacity 0.15s ease;
    }
    #pink-effect-overlay.active {
      opacity: 1; animation: popScale 0.4s ease-out;
    }
    @keyframes popScale {
      0% { transform: scale(0.6); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1.0); }
    }
    .pink-bonus-banner {
      font-size: clamp(28px, 7vw, 54px); font-weight: 900; color: #fff;
      text-shadow: 0 0 20px #ff1493, 3px 3px 0 #c71585, -3px -3px 0 #ff69b4;
      background: linear-gradient(90deg, rgba(255,20,147,0.8), rgba(255,105,180,0.9), rgba(255,20,147,0.8));
      padding: 12px 30px; border-radius: 50px; border: 4px solid #fff;
      box-shadow: 0 0 30px #ff69b4, inset 0 0 15px #fff;
    }

    /* ボス戦UI */
    #boss-hp-container {
      position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
      width: 80%; max-width: 400px; display: none; flex-direction: column;
      align-items: center; z-index: 20;
    }
    .boss-label { font-size: 16px; font-weight: 900; color: #ff3d00; text-shadow: 1px 1px 2px #000; margin-bottom: 4px; }
    .hp-bar-bg { width: 100%; height: 20px; background: #333; border: 2px solid #fff; border-radius: 10px; overflow: hidden; }
    .hp-bar-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #ff1744, #ff9100); transition: width 0.2s ease; }

    #warning-overlay {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 50;
      background: rgba(255, 0, 0, 0.4); display: none; flex-direction: column;
      justify-content: center; align-items: center; pointer-events: none;
      animation: blink 0.3s infinite alternate;
    }
    @keyframes blink { from { opacity: 0.3; } to { opacity: 0.9; } }
    #warning-text { font-size: clamp(32px, 8vw, 60px); font-weight: 900; color: #ff1744; text-shadow: 3px 3px 0 #000, -3px -3px 0 #000; }

    #hit-flash {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 5;
      background: rgba(255, 230, 0, 0.4); opacity: 0; transition: opacity 0.08s ease; pointer-events: none;
    }

    /* ① リザルト画面 */
    #result-modal {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 100;
      background: radial-gradient(circle, rgba(16, 42, 20, 0.95) 0%, rgba(5, 18, 8, 0.98) 100%);
      display: none; flex-direction: column; align-items: center; justify-content: center; padding: 15px;
    }
    .result-board { width: 90%; max-width: 480px; padding: 20px; text-align: center; }
    .result-board h1 { font-size: clamp(22px, 5vw, 30px); font-weight: 900; color: #ffe600; text-shadow: 2px 2px 0 #5c2c00; }
    .score-box { font-size: clamp(32px, 7vw, 48px); font-weight: 900; color: #fff; margin: 8px 0; text-shadow: 3px 3px 0 #e65100; }
    .rank-info { font-size: 18px; color: #76ff03; font-weight: 900; margin-bottom: 12px; }
    
    .ranking-list {
      background: rgba(0,0,0,0.5); border-radius: 10px; padding: 10px; margin-bottom: 15px; text-align: left;
    }
    .ranking-item { display: flex; justify-content: space-between; font-weight: 800; color: #fff; padding: 4px 8px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .ranking-item.my-score { color: #ffe600; background: rgba(255, 230, 0, 0.2); border-radius: 4px; }

    /* ② 動画画面 */
    #video-overlay {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 200;
      background: #000; display: none; justify-content: center; align-items: center;
    }
    #ending-video { width: 100vw; height: 100vh; object-fit: contain; }

    /* ③ ド派手金ピカ（ゴージャス）ヒント＆謝辞画面 */
    #hint-overlay {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 300;
      background: radial-gradient(circle, rgba(30, 20, 0, 0.98) 0%, rgba(10, 5, 0, 0.99) 100%);
      display: none; flex-direction: column; align-items: center; justify-content: center; padding: 15px;
      text-align: center; color: #fff; overflow: hidden;
    }

    /* 金ピカパーティクル背景キャンバス */
    #sparkle-canvas {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none; z-index: 1;
    }

    .gorgeous-card {
      position: relative; z-index: 2;
      width: 92%; max-width: 440px; padding: 25px 20px;
      background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
      border: 4px solid #fff; border-radius: 24px;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.8), inset 0 0 15px rgba(255, 255, 255, 0.9), 0 12px 24px rgba(0,0,0,0.8);
      animation: goldGlow 2s infinite alternate;
    }

    @keyframes goldGlow {
      0% { box-shadow: 0 0 25px rgba(255, 215, 0, 0.7), inset 0 0 15px #fff; }
      100% { box-shadow: 0 0 45px rgba(255, 230, 0, 1), inset 0 0 25px #fff; }
    }

    .gorgeous-inner {
      background: rgba(15, 10, 5, 0.92); border-radius: 18px; padding: 20px 15px;
      border: 2px solid #ffe600;
    }

    .hint-title {
      font-size: clamp(22px, 5.5vw, 30px); font-weight: 900; color: #ffe600;
      text-shadow: 0 0 12px #ff9100, 2px 2px 0 #5c2c00; margin-bottom: 14px;
      letter-spacing: 1px;
    }

    .hint-body {
      font-size: clamp(13px, 3.2vw, 16px); font-weight: 800; line-height: 1.6; color: #fff;
      background: rgba(255,255,255,0.05); padding: 14px 10px; border-radius: 14px;
      border: 1.5px solid rgba(255, 230, 0, 0.5); margin-bottom: 18px;
      text-shadow: 1px 1px 2px #000; word-break: break-all;
    }

    .thanks-text {
      font-size: clamp(18px, 4.5vw, 24px); font-weight: 900; color: #fff;
      text-shadow: 0 0 10px #ffe600, 2px 2px 0 #8b5a2b; letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <video id="camera-feed" autoplay playsinline muted></video>
    <canvas id="proc-canvas" width="320" height="240"></canvas>

    <!-- スタート画面 -->
    <div id="start-overlay">
      <button id="start-btn" class="btn-gold">スタート</button>
    </div>

    <!-- HUD -->
    <div id="ui-layer">
      <div class="hud-header wooden-panel">
        <div class="score-badge" id="score-badge">🏆 SCORE: <span id="score-val">0</span></div>
        <div id="lockon-indicator">🔍 ターゲット捜索中...</div>
      </div>
      <div class="crosshair" id="crosshair"></div>
    </div>

    <!-- 💖 豪華ピンクエフェクト演出 -->
    <div id="pink-effect-overlay">
      <div class="pink-bonus-banner">✨ 💖 BONUS +10000 💖 ✨</div>
    </div>

    <!-- ボスHPUI -->
    <div id="boss-hp-container">
      <div class="boss-label">🗿 BOSS: 巨大ガーディアン</div>
      <div class="hp-bar-bg"><div id="boss-hp-fill" class="hp-bar-fill"></div></div>
    </div>

    <!-- 警報オーバーレイ -->
    <div id="warning-overlay">
      <div id="warning-text">⚠️ WARNING ⚠️</div>
      <div style="color:#fff; font-size:20px; font-weight:900; text-shadow:1px 1px 2px #000; margin-top:10px;">BOSS APPROACHING!</div>
    </div>

    <div id="hit-flash"></div>

    <!-- ① リザルト画面 -->
    <div id="result-modal">
      <div class="wooden-panel result-board">
        <h1>MISSION COMPLETE!</h1>
        <div class="score-box"><span id="final-score">0</span> PT</div>
        <div class="rank-info" id="rank-info">本日の順位: 計算中...</div>
        <div class="ranking-list" id="ranking-list"></div>
        <div style="color:#ffe600; font-size:14px; font-weight:800; margin-top:5px;">🎬 まもなくスペシャル動画が再生されます...</div>
      </div>
    </div>

    <!-- ② 動画画面 -->
    <div id="video-overlay">
      <video id="ending-video" playsinline muted autoplay style="width:100vw; height:100vh; object-fit:contain;">
        <source src="ending.mp4" type="video/mp4">
      </video>
    </div>

    <!-- ③ ド派手金ピカ（ゴージャス）ヒント＆謝辞画面 -->
    <div id="hint-overlay">
      <canvas id="sparkle-canvas"></canvas>
      <div class="gorgeous-card">
        <div class="gorgeous-inner">
          <div class="hint-title" id="hint-title">✨ TREASURE RESULT ✨</div>
          <div class="hint-body" id="hint-body"></div>
          <div class="thanks-text">ありがとうございました！</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let score = 0;
    let isGameStarted = false;
    let canScore = true;
    let isCoolingDown = false;
    let isBossPhase = false;
    let bossHp = 4;
    const MAX_BOSS_HP = 4;

    // ピンク読取個数
    let pinkHitCount = 0;

    // 管理者タップ用カウント
    let adminTapCount = 0;

    const videoEl = document.getElementById('camera-feed');
    const canvasEl = document.getElementById('proc-canvas');
    const ctx = canvasEl.getContext('2d', { willReadFrequently: true });

    const scoreVal = document.getElementById('score-val');
    const scoreBadge = document.getElementById('score-badge');
    const lockonIndicator = document.getElementById('lockon-indicator');
    const crosshair = document.getElementById('crosshair');
    const hitFlash = document.getElementById('hit-flash');
    const startOverlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');
    const warningOverlay = document.getElementById('warning-overlay');
    const bossHpContainer = document.getElementById('boss-hp-container');
    const bossHpFill = document.getElementById('boss-hp-fill');
    const pinkEffectOverlay = document.getElementById('pink-effect-overlay');
    
    const resultModal = document.getElementById('result-modal');
    const videoOverlay = document.getElementById('video-overlay');
    const endingVideo = document.getElementById('ending-video');
    const hintOverlay = document.getElementById('hint-overlay');
    const hintTitle = document.getElementById('hint-title');
    const hintBody = document.getElementById('hint-body');

    let audioCtx;

    function requestFullScreen() {
      const docEl = document.documentElement;
      if (docEl.requestFullscreen) { docEl.requestFullscreen().catch(() => {}); }
      else if (docEl.webkitRequestFullscreen) { docEl.webkitRequestFullscreen().catch(() => {}); }
      window.scrollTo(0, 1);
    }

    function playHitSE() {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(450, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(90, audioCtx.currentTime + 0.22);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.22);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.22);
      } catch (e) {}
    }

    function playPinkBonusSE() {
      if (!audioCtx) return;
      try {
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.06);
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime + idx * 0.06);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.06 + 0.2);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime + idx * 0.06);
          osc.stop(audioCtx.currentTime + idx * 0.06 + 0.2);
        });
      } catch (e) {}
    }

    function playWarningSound() {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(300, audioCtx.currentTime + 0.35);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.35);
      } catch(e) {}
    }

    startBtn.addEventListener('click', async () => {
      requestFullScreen();

      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') await audioCtx.resume();
      } catch (e) {}

      const constraintsList = [
        { video: { facingMode: { exact: "environment" }, width: { ideal: 640 }, height: { ideal: 480 } }, audio: false },
        { video: { facingMode: "environment" }, audio: false },
        { video: true, audio: false }
      ];

      let stream = null;
      for (const constraints of constraintsList) {
        try { stream = await navigator.mediaDevices.getUserMedia(constraints); if (stream) break; } catch (err) {}
      }

      if (!stream) {
        alert("カメラが起動できません。");
        return;
      }

      videoEl.srcObject = stream;
      try { await videoEl.play(); } catch (e) {}

      startOverlay.style.display = 'none';
      isGameStarted = true;

      requestAnimationFrame(processFrame);
      setTimeout(triggerBossBattle, 16000);
    });

    function rgbToHsv(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      const d = max - min;
      let h = 0, s = max === 0 ? 0 : d / max, v = max;
      if (max !== min) {
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
      }
      return [h * 360, s, v];
    }

    function processFrame() {
      if (!isGameStarted) return;

      if (videoEl.readyState === videoEl.HAVE_ENOUGH_DATA) {
        ctx.drawImage(videoEl, 0, 0, 320, 240);

        const startX = 32, startY = 24, width = 256, height = 192;
        const imgData = ctx.getImageData(startX, startY, width, height);
        const data = imgData.data;

        let redPixels = 0;
        let pinkPixels = 0;
        const totalPixels = width * height;

        for (let i = 0; i < data.length; i += 4) {
          const r = data[i], g = data[i + 1], b = data[i + 2];
          const [h, s, v] = rgbToHsv(r, g, b);

          if ((h >= 335 || h <= 25) && s > 0.30 && v > 0.20) {
            redPixels++;
          }
          else if (h >= 300 && h <= 330 && s > 0.45 && v > 0.45) {
            pinkPixels++;
          }
        }

        const isRedDetected = (redPixels / totalPixels) > 0.008;
        const isPinkDetected = (pinkPixels / totalPixels) > 0.015;

        if (!isCoolingDown) {
          if (isPinkDetected) {
            lockonIndicator.textContent = "💖 ボーナスターゲット！";
            lockonIndicator.className = 'bonus';
            crosshair.className = 'crosshair detected-pink';

            if (canScore) { triggerHit(10000, true); }
          } else if (isRedDetected) {
            lockonIndicator.textContent = "🎯 ターゲット捕捉！";
            lockonIndicator.className = 'locked';
            crosshair.className = 'crosshair detected-red';

            if (canScore) { triggerHit(1000, false); }
          } else {
            lockonIndicator.textContent = "🔍 ターゲット捜索中...";
            lockonIndicator.className = '';
            crosshair.className = 'crosshair';
            canScore = true;
          }
        }
      }

      requestAnimationFrame(processFrame);
    }

    function triggerHit(points, isBonus) {
      canScore = false;
      isCoolingDown = true;

      if (isBonus) pinkHitCount++;

      onTargetHit(points, isBonus);

      setTimeout(() => { isCoolingDown = false; }, 500);
    }

    function onTargetHit(points, isBonus) {
      if (isBonus) {
        playPinkBonusSE();
        pinkEffectOverlay.classList.add('active');
        hitFlash.style.background = 'rgba(255, 20, 147, 0.7)';
        hitFlash.style.opacity = '1';

        setTimeout(() => {
          pinkEffectOverlay.classList.remove('active');
          hitFlash.style.opacity = '0';
        }, 600);
      } else {
        playHitSE();
        hitFlash.style.background = 'rgba(255, 230, 0, 0.4)';
        hitFlash.style.opacity = '1';
        setTimeout(() => { hitFlash.style.opacity = '0'; }, 120);
      }

      if (!isBossPhase) {
        score += points;
        scoreVal.textContent = score.toLocaleString();
      } else {
        score += 5000;
        scoreVal.textContent = score.toLocaleString();
        bossHp--;
        const hpPercent = Math.max(0, (bossHp / MAX_BOSS_HP) * 100);
        bossHpFill.style.width = hpPercent + '%';

        if (bossHp <= 0) {
          endGame();
        }
      }
    }

    function triggerBossBattle() {
      if (!isGameStarted) return;
      
      warningOverlay.style.display = 'flex';

      if ("vibrate" in navigator) {
        navigator.vibrate([400, 100, 400, 100, 600]);
      }

      playWarningSound();
      const warnInterval = setInterval(playWarningSound, 450);

      setTimeout(() => {
        clearInterval(warnInterval);
        warningOverlay.style.display = 'none';
        isBossPhase = true;
        bossHpContainer.style.display = 'flex';
        lockonIndicator.textContent = "⚠️ ボスを4回撃破せよ！";
      }, 2500);
    }

    function endGame() {
      isGameStarted = false;
      resultModal.style.display = 'flex';
      document.getElementById('final-score').textContent = score.toLocaleString();

      const today = new Date().toISOString().split('T')[0];
      const storageKey = `ranking_${today}`;
      
      let ranking = JSON.parse(localStorage.getItem(storageKey) || "[]");
      const myRecord = { score: score, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) };
      ranking.push(myRecord);
      ranking.sort((a, b) => b.score - a.score);
      
      const myRank = ranking.indexOf(myRecord) + 1;
      document.getElementById('rank-info').textContent = `本日の順位: 第 ${myRank} 位 / ${ranking.length}人中`;

      const rankingListEl = document.getElementById('ranking-list');
      rankingListEl.innerHTML = '<div style="font-size:12px; color:#ff9100; margin-bottom:4px;">🏆 本日のハイスコア TOP 5</div>';
      
      ranking.slice(0, 5).forEach((item, index) => {
        const isMe = (item === myRecord);
        const div = document.createElement('div');
        div.className = `ranking-item ${isMe ? 'my-score' : ''}`;
        div.innerHTML = `<span>${index + 1}位 ${isMe ? '(あなた)' : ''}</span> <span>${item.score.toLocaleString()} PT</span>`;
        rankingListEl.appendChild(div);
      });

      localStorage.setItem(storageKey, JSON.stringify(ranking));

      setTimeout(() => {
        resultModal.style.display = 'none';
        videoOverlay.style.display = 'flex';
        endingVideo.muted = false;
        endingVideo.play().catch(() => {});
      }, 3500);
    }

    // 動画終了時 ➔ 金ピカゴージャス画面表示＆キラキラパーティカル開始
    endingVideo.addEventListener('ended', () => {
      videoOverlay.style.display = 'none';
      hintOverlay.style.display = 'flex';

      startSparkleAnimation(); // キラキラ金ピカアニメーション起動

      if (pinkHitCount === 0) {
        // ピンク未検出時（単位：個）
        hintTitle.textContent = "🔍 探検隊のヒント";
        hintTitle.style.color = "#ffe600";
        hintBody.innerHTML = "コースター沿道には高得点の<br><span style='color:#ff69b4; font-size:18px; font-weight:900;'>【ピンクのレア的】</span>が隠されています！<br><br>次は<span style='color:#ffe600; font-weight:900;'>『木の上』</span>や<span style='color:#ffe600; font-weight:900;'>『天井付近』</span>に注目してみよう！";
      } else {
        // ピンク検出済み（単位：個）
        hintTitle.textContent = "👑 伝説のハンター 👑";
        hintTitle.style.color = "#ffe600";
        hintBody.innerHTML = `見事にピンクのレア的を<br><span style='color:#ff69b4; font-size:22px; font-weight:900;'> ${pinkHitCount} 個 </span>発見しました！<br><br>ジャングルの伝説のトレジャーハンター認定です！`;
      }
    });

    // 🌟 金ピカキラキラパーティクルを描画する処理
    function startSparkleAnimation() {
      const spCanvas = document.getElementById('sparkle-canvas');
      const spCtx = spCanvas.getContext('2d');
      spCanvas.width = window.innerWidth;
      spCanvas.height = window.innerHeight;

      const particles = [];
      const colors = ['#ffe600', '#ffca28', '#fff', '#ff9100', '#ffd54f'];

      for (let i = 0; i < 40; i++) {
        particles.push({
          x: Math.random() * spCanvas.width,
          y: Math.random() * spCanvas.height,
          size: Math.random() * 4 + 2,
          speedY: -(Math.random() * 1.5 + 0.5),
          speedX: Math.random() * 1 - 0.5,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: Math.random()
        });
      }

      function drawSparkles() {
        spCtx.clearRect(0, 0, spCanvas.width, spCanvas.height);
        particles.forEach(p => {
          p.y += p.speedY;
          p.x += p.speedX;
          p.alpha += (Math.random() - 0.5) * 0.05;

          if (p.y < 0) p.y = spCanvas.height;
          if (p.x < 0 || p.x > spCanvas.width) p.x = Math.random() * spCanvas.width;

          spCtx.save();
          spCtx.globalAlpha = Math.max(0.2, Math.min(1, p.alpha));
          spCtx.fillStyle = p.color;
          spCtx.beginPath();
          spCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          spCtx.fill();
          spCtx.restore();
        });
        requestAnimationFrame(drawSparkles);
      }
      drawSparkles();
    }

    // 管理者リセット
    scoreBadge.addEventListener('click', () => {
      adminTapCount++;
      if (adminTapCount >= 5) {
        adminTapCount = 0;
        const password = prompt("【管理者用メニュー】パスワードを入力してください:");
        if (password === "admin123") {
          const today = new Date().toISOString().split('T')[0];
          localStorage.removeItem(`ranking_${today}`);
          alert("本日のランキングデータをリセットしました。");
        } else if (password !== null) {
          alert("パスワードが違います。");
        }
      }
      setTimeout(() => { adminTapCount = 0; }, 3000);
    });
  </script>
